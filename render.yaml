databases:
  - name: crypto-bot-db
    plan: basic-256mb
    region: frankfurt
    databaseName: crypto_bot
    user: crypto_bot_user

services:
  - type: worker
    name: crypto-bot-engine
    env: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m backend.main"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: USE_TESTNET
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: STARTING_BALANCE
        value: "100"
      - key: RISK_SCALP
        value: "0.01"
      - key: RISK_DAY
        value: "0.01"
      - key: DAILY_MAX_LOSS_PERCENT
        value: "0.05"
      - key: AI_MODE
        value: "required"
      - key: DATA_FROM_MAINNET
        value: "true"
      # --- SMC Scalper (şartname v2.1) — aynı worker içinde ayrı thread ---
      - key: SMC_ENABLED
        value: "true"
      - key: SMC_ACCOUNT_SCOPE
        value: shared
      - key: SMC_STARTING_EQUITY
        value: "100"
      - key: SMC_RISK_PER_TRADE   # eski SMC stratejisi için; varsayılan breakout stratejisi her zaman %1 kullanır
        value: "0.01"
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-bot-db
          property: connectionString

  - type: web
    name: crypto-bot-dashboard
    env: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.dashboard.api:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    envVars:
      # --- Panel girişi (SMC Bot + SMC Scalper) ---
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD_HASH   # python -m scripts.smc.hash_password çıktısı
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: USE_TESTNET
        value: "true"
      - key: STARTING_BALANCE
        value: "100"
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: crypto-bot-db
          property: connectionString
      # --- SMC Bot (backend/smcbot): bu servisin içinde çalışır, paneli "/" ---
      - key: SMCBOT_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_TOKEN       # worker'daki değer otomatik kopyalanır
        fromService:
          type: worker
          name: crypto-bot-engine
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_CHAT_ID
        fromService:
          type: worker
          name: crypto-bot-engine
          envVarKey: TELEGRAM_CHAT_ID
      - key: SMCBOT_LIVE_API_KEY      # sadece gerçek moda geçince gerekir (çekim izni KAPALI anahtar)
        sync: false
      - key: SMCBOT_LIVE_API_SECRET
        sync: false
      - key: COINGLASS_API_KEY        # isteğe bağlı, ücretli
        sync: false

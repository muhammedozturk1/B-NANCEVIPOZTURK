<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Bot · Giriş</title>
<style>
  :root{--bg:#0b0e13;--panel:#131820;--line:#222a36;--text:#e6eaf0;--muted:#8792a2;--accent:#f0b90b;--red:#f6465d}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
  color:var(--text);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif}
  form{width:min(360px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px}
  h1{font-size:16px;margin:0 0 4px;letter-spacing:.04em}p{margin:0 0 20px;color:var(--muted);font-size:12px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
  input{width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:#0e1218;color:var(--text);font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  button{margin-top:20px;width:100%;padding:10px;border:0;border-radius:6px;background:var(--accent);color:#111;font-weight:600;cursor:pointer}
  .err{color:var(--red);font-size:12px;margin-top:12px}
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="on">
  <input type="hidden" name="next" value="{{ next or '/' }}">
  <h1>CRYPTO BOT</h1><p>Funding paneli · SMC Scalper paneli</p>
  <label for="u">Kullanıcı adı</label><input id="u" name="username" required autofocus>
  <label for="p">Şifre</label><input id="p" name="password" type="password" required>
  <button type="submit">Giriş</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Bot · Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0a0e14;
    --bg-2: #11161f;
    --card: #151b26;
    --card-hover: #1a2230;
    --border: #232b3a;
    --border-light: #2d3648;
    --text: #e6edf3;
    --text-dim: #8b96a8;
    --text-mute: #5a6577;
    --green: #26d07c;
    --green-bg: #26d07c15;
    --red: #f85149;
    --red-bg: #f8514915;
    --blue: #4d9fff;
    --blue-bg: #4d9fff15;
    --yellow: #e3b341;
    --yellow-bg: #e3b34115;
    --purple: #a371f7;
    --purple-bg: #a371f715;
    --scalp: #4d9fff;
    --day: #e3b341;
    --swing: #a371f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    position: sticky;
    top: 0;
    height: 100vh;
    flex-shrink: 0;
  }
  .logo {
    padding: 0 20px 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .logo h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .logo .dot {
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .logo p { color: var(--text-mute); font-size: 11px; margin-top: 4px; }

  .nav { padding: 0 12px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
    margin-bottom: 2px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
  }
  .nav-item:hover { background: var(--card-hover); color: var(--text); }
  .nav-item.active { background: var(--blue-bg); color: var(--blue); }
  .nav-item .icon { width: 16px; text-align: center; }
  .nav-section {
    color: var(--text-mute);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 16px 12px 6px;
    font-weight: 600;
  }

  .main { flex: 1; padding: 24px 32px; max-width: 100%; overflow-x: hidden; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.4px; }
  .page-sub { color: var(--text-mute); font-size: 12px; margin-top: 2px; }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--green-bg);
    color: var(--green);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }
  .status-pill .dot {
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  /* KPI CARDS */
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .kpi:hover { border-color: var(--border-light); transform: translateY(-1px); }
  .kpi .label {
    color: var(--text-mute);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kpi .value {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.8px;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .kpi .value .pct {
    font-size: 14px;
    font-weight: 600;
    opacity: 0.9;
  }
  .kpi .delta {
    font-size: 12px;
    margin-top: 6px;
    color: var(--text-mute);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .kpi-accent {
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
  }
  .kpi.blue .kpi-accent { background: var(--blue); }
  .kpi.green .kpi-accent { background: var(--green); }
  .kpi.red .kpi-accent { background: var(--red); }
  .kpi.purple .kpi-accent { background: var(--purple); }

  .green { color: var(--green); }
  .red { color: var(--red); }
  .blue { color: var(--blue); }
  .yellow { color: var(--yellow); }
  .muted { color: var(--text-mute); }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title .icon-box {
    width: 24px; height: 24px;
    background: var(--blue-bg);
    color: var(--blue);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  select, button, input {
    background: var(--bg-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
    outline: none;
  }
  select:hover, button:hover { border-color: var(--border-light); }
  select:focus, input:focus { border-color: var(--blue); }
  button.active {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
    font-weight: 600;
  }
  .btn-group { display: flex; gap: 6px; }

  #chart { width: 100%; height: 420px; }

  /* EXIT BREAKDOWN */
  .exit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .exit-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .exit-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .exit-engine-name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  .exit-engine-name.scalp { color: var(--scalp); }
  .exit-engine-name.day { color: var(--day); }
  .exit-engine-name.swing { color: var(--swing); }
  .exit-badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 10px;
    background: var(--blue-bg);
    color: var(--blue);
    font-weight: 600;
  }
  .exit-rows { display: flex; flex-direction: column; gap: 8px; }
  .exit-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }
  .exit-row .lbl {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dim);
  }
  .exit-row .lbl .bullet {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .exit-row .val {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: 14px;
  }

  /* TABLE */
  .table-wrap { overflow-x: auto; margin: -8px; padding: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    padding: 10px 12px;
    color: var(--text-mute);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
